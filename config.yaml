# 카오스 타워 설정
server:
  port: 8001

camera:
  enabled: true          # false면 손 인식 없이 마우스로만 (카메라가 다른 프로그램에 잡혀 있어도 자동으로 마우스)
  width: 640             # 컬러 해상도 (BGR 무압축) + 하드웨어로 정렬된 깊이
  height: 360
  webcam_fallback: true  # 오르벡 카메라를 못 열면 일반 웹캠(깊이 없음)으로 시도. 노트북 내장 카메라로 테스트할 때
  webcam_index: 0        # 웹캠 번호 (여러 대면 1, 2 …)
  mirror: true           # 거울처럼: 관람객이 오른손을 오른쪽으로 옮기면 가상 손도 화면 오른쪽으로

hand:
  model: models/hand_landmarker.task
  delegate: gpu          # gpu (젯슨에서 약 22ms) | cpu (약 75ms). gpu가 안 되면 자동으로 cpu
  max_hands: 2           # 여러 손이 보이면 따라가던 손, 없으면 카메라에 가장 가까운 손
  # 손가락 펴짐 비율 = 손가락 끝-손목 ÷ 뿌리-손목 (주먹 약 1.0, 편하게 편 손 약 1.6, 쫙 편 손 약 1.9)
  grab_close: 1.20       # 이보다 작으면 쥠
  grab_open: 1.40        # 이보다 크면 폄 (두 값 사이에서는 직전 상태 유지). /video 화면의 open 값을 보고 조정
  # 손 움직임 범위: 카메라 기준 좌표(m). 이 상자가 게임 화면 전체에 대응
  # 카메라에 가까이 서면 화면에 보이는 범위가 좁아지므로, 손가락까지 카메라 안에 남도록 상자를 자동으로 줄임
  box:
    center_x: 0.0        # + = 카메라가 볼 때 오른쪽
    center_y: 0.0        # + = 카메라보다 아래
    half_w: 0.28         # 좌우 ±28cm 손을 움직이면 화면 끝에서 끝
    half_h: 0.18         # 위아래 ±18cm
  menu_gain: 1.25        # 메뉴(시작·계속하기·키패드)에서는 커서를 이만큼 더 크게 움직임
  depth_ref: 0.7         # 기본 손 거리(m). 게임 시작 카운트다운 동안 실제 손 거리로 다시 맞춤
  depth_range: 0.25      # 기준에서 ±25cm 앞뒤로 움직이면 게임 안 앞뒤 끝
